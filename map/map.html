<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行足迹地图 | JY's blog</title>
    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 地图页面特定样式 */
        .map-stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .stat-item {
            padding: 15px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .location-gallery {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .gallery-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .gallery-images img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-images img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .map-stats {
                flex-direction: column;
                gap: 15px;
            }

            .gallery-images {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的旅行足迹</h1>
            <p class="subtitle">探索世界，记录美好时光</p>
        </header>
        
        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
            </div>
            
            <div class="sidebar">
                <div class="info-box">
                    <h2>旅行地点</h2>
                    <div class="location-list">
                        <div class="location-item active" data-location="beijing">
                            <h3>北京</h3>
                            <p>2023年10月 | 历史文化之旅</p>
                        </div>
                        <div class="location-item" data-location="paris">
                            <h3>巴黎</h3>
                            <p>2023年7月 | 浪漫之都</p>
                        </div>
                        <div class="location-item" data-location="tokyo">
                            <h3>东京</h3>
                            <p>2023年4月 | 樱花季节</p>
                        </div>
                        <div class="location-item" data-location="newyork">
                            <h3>纽约</h3>
                            <p>2022年12月 | 圣诞之旅</p>
                        </div>
                        <div class="location-item" data-location="sydney">
                            <h3>悉尼</h3>
                            <p>2022年8月 | 阳光海滩</p>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" id="zoom-in">放大</button>
                    <button class="btn" id="zoom-out">缩小</button>
                    <button class="btn" id="reset-view">重置视图</button>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number">12</div>
                        <div class="stat-label">已访城市</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">5</div>
                        <div class="stat-label">已访国家</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">36K</div>
                        <div class="stat-label">旅行里程</div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 我的旅行博客 | 使用百度地图API绘制</p>
        </footer>
    </div>

    <!-- 引入百度地图API -->
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=DJwogTtbe4RBefFeypCOeBxSpUJYtyEP"></script>
    <script>
        // 初始化地图
        var map = new BMap.Map("map");
        var point = new BMap.Point(116.404, 39.915);
        map.centerAndZoom(point, 2);
        map.enableScrollWheelZoom(true);
        
        // 添加缩放控件
        map.addControl(new BMap.NavigationControl());
        
        // 定义地点数据
        var locations = {
            beijing: {
                point: new BMap.Point(116.404, 39.915),
                zoom: 10,
                title: "北京",
                content: "2023年10月游览了故宫、长城和颐和园，感受了深厚的历史文化底蕴。"
            },
            paris: {
                point: new BMap.Point(2.3522, 48.8566),
                zoom: 12,
                title: "巴黎",
                content: "2023年7月参观埃菲尔铁塔、卢浮宫和香榭丽舍大街，体验浪漫之都的魅力。"
            },
            tokyo: {
                point: new BMap.Point(139.6917, 35.6895),
                zoom: 10,
                title: "东京",
                content: "2023年4月赏樱之旅，游览了东京塔、浅草寺和上野公园。"
            },
            newyork: {
                point: new BMap.Point(-74.0060, 40.7128),
                zoom: 12,
                title: "纽约",
                content: "2022年12月圣诞之旅，参观了自由女神像、时代广场和中央公园。"
            },
            sydney: {
                point: new BMap.Point(151.2093, -33.8688),
                zoom: 12,
                title: "悉尼",
                content: "2022年8月享受阳光海滩，游览了悉尼歌剧院、海港大桥和邦迪海滩。"
            }
        };
        
        // 添加标记和信息窗口
        var infoWindow = new BMap.InfoWindow("", {width: 250, height: 100});
        
        for (var key in locations) {
            if (locations.hasOwnProperty(key)) {
                var loc = locations[key];
                var marker = new BMap.Marker(loc.point);
                map.addOverlay(marker);
                
                marker.addEventListener("click", function() {
                    var point = this.getPosition();
                    map.panTo(point);
                    infoWindow.setContent('<div style="margin:10px;"><h4>' + loc.title + '</h4><p>' + loc.content + '</p></div>');
                    map.openInfoWindow(infoWindow, point);
                });
            }
        }
        
        // 添加地点列表交互
        var locationItems = document.querySelectorAll('.location-item');
        locationItems.forEach(function(item) {
            item.addEventListener('click', function() {
                // 移除所有active类
                locationItems.forEach(function(el) {
                    el.classList.remove('active');
                });
                
                // 添加active类到当前项
                this.classList.add('active');
                
                // 获取地点数据
                var locationKey = this.getAttribute('data-location');
                var location = locations[locationKey];
                
                // 移动地图到该位置
                map.panTo(location.point);
                map.setZoom(location.zoom);
                
                // 打开信息窗口
                infoWindow.setContent('<div style="margin:10px;"><h4>' + location.title + '</h4><p>' + location.content + '</p></div>');
                map.openInfoWindow(infoWindow, location.point);
            });
        });
        
        // 添加按钮功能
        document.getElementById('zoom-in').addEventListener('click', function() {
            map.zoomIn();
        });
        
        document.getElementById('zoom-out').addEventListener('click', function() {
            map.zoomOut();
        });
        
        document.getElementById('reset-view').addEventListener('click', function() {
            map.centerAndZoom(point, 2);
        });
        
        // 添加一些自定义覆盖物（旅行路线）
        var polylinePoints = [
            new BMap.Point(116.404, 39.915),
            new BMap.Point(2.3522, 48.8566),
            new BMap.Point(139.6917, 35.6895),
            new BMap.Point(-74.0060, 40.7128),
            new BMap.Point(151.2093, -33.8688)
        ];
        
        var polyline = new BMap.Polyline(polylinePoints, {
            strokeColor: "#3498db",
            strokeWeight: 3,
            strokeOpacity: 0.7
        });
        map.addOverlay(polyline);
    </script>
</body>
</html>
