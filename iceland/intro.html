            <h2>冰岛共和国</h2>
            <p>冰岛是位于北大西洋和北冰洋之间的北欧岛国，靠近北极圈，是欧洲第二大岛，首都是雷克雅未克。</p>
            <img src="pictures/冰岛/Flag_of_Iceland.svg.png" alt="冰岛国旗">
            <p>公元9世纪中期，爱尔兰人和挪威人移民到冰岛，成为最早居民。1944年6月17日，冰岛共和国成立。</p>
        </section>

        <section class="section">
            <h3>地理特点</h3>
            <ul>
                <li>官方语言：冰岛语</li>
                <li>时区：比北京晚8小时</li>
                <li>货币：冰岛克朗 (ISK)</li>
                <li>气候：受墨西哥湾暖流影响，气候温和</li>
            </ul>
        </section>
